name: Build DEB
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Frontend install and build
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Package DEB
        run: |
          VERSION="0.5.1+ci.${GITHUB_RUN_NUMBER}" bash packaging/build-deb.sh
          echo "Built Debian version: 0.5.1+ci.${GITHUB_RUN_NUMBER}"
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'server.py|adapters/|start.sh|index.html|turret-web.service|etc/default/turret-web|sudoers.d/turret-web'
      - name: Upload offline DEB
        uses: actions/upload-artifact@v4
        with:
          name: turret-web-deb
          path: dist/*.deb
          if-no-files-found: error
